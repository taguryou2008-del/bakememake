<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化門板対戦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* iPad & Touch optimizations */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        /* Card & Effects Animation */
        .card-glow-human {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border: 2px solid #3b82f6;
        }
        .card-glow-bakemon {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            border: 2px solid #ef4444;
        }
        .damage-pop {
            animation: popUp 0.8s ease-out forwards;
        }
        @keyframes popUp {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
    <style>
/* 漫画風バトルエフェクト */
@keyframes battleShake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-5px, 2px); }
  40% { transform: translate(5px, -2px); }
  60% { transform: translate(-3px, -1px); }
  80% { transform: translate(3px, 1px); }
}

.battle-shake {
  animation: battleShake 260ms ease-out;
}

.battle-fx-overlay {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  overflow: hidden;
}

.battle-flash {
  position: absolute;
  inset: 0;
  background: white;
  animation: hitFlash 220ms ease-out forwards;
}

@keyframes hitFlash {
  0% { opacity: 0.65; }
  100% { opacity: 0; }
}

.damage-number {
  position: absolute;
  left: 50%;
  top: 42%;
  color: #ffdf62;
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 1000;
  -webkit-text-stroke: 2px #8b1b16;
  paint-order: stroke fill;
  text-shadow: 3px 4px 0 #54120e;
  transform: translate(-50%, 0) scale(0.5) rotate(-8deg);
  animation: damagePop 700ms ease-out forwards;
}

@keyframes damagePop {
  15% { transform: translate(-50%, -10px) scale(1.2) rotate(-8deg); }
  35% { transform: translate(-50%, -18px) scale(1) rotate(5deg); }
  100% { transform: translate(-50%, -90px) scale(0.85) rotate(5deg); opacity: 0; }
}

.battle-shockwave {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 35px;
  height: 35px;
  border: 5px solid #fff3a1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 18px #ffae35;
  animation: shockwave 480ms ease-out forwards;
}

@keyframes shockwave {
  to {
    width: 230px;
    height: 230px;
    opacity: 0;
    border-width: 1px;
  }
}

.battle-particle {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 9px;
  height: 18px;
  border-radius: 3px;
  background: #ffd85c;
  box-shadow: 0 0 10px #ff9b30;
  animation: particleBurst 550ms ease-out forwards;
}

@keyframes particleBurst {
  to {
    transform: translate(var(--dx), var(--dy)) rotate(240deg) scale(0.2);
    opacity: 0;
  }
}

.battle-result-fx {
  position: fixed;
  inset: 0;
  z-index: 10001;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #050812d9;
  pointer-events: none;
  animation: resultFade 2.2s ease forwards;
}

.battle-result-fx span {
  font-size: clamp(42px, 12vw, 90px);
  font-weight: 1000;
  font-style: italic;
  text-align: center;
  color: #ffd45a;
  -webkit-text-stroke: 2px #7c2518;
  text-shadow: 0 0 25px #ff8c25, 5px 6px 0 #42130d;
  animation: resultZoom 650ms cubic-bezier(.2,.8,.2,1) both;
}

.battle-result-fx.is-defeat span {
  color: #e5e7eb;
  -webkit-text-stroke-color: #4b111b;
  text-shadow: 0 0 22px #e11d48, 4px 5px 0 #290812;
}

@keyframes resultZoom {
  from { transform: scale(2.2) rotate(-7deg); opacity: 0; }
  to { transform: scale(1) rotate(-3deg); opacity: 1; }
}

@keyframes resultFade {
  0%, 75% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

@media (prefers-reduced-motion: reduce) {
  .battle-shake,
  .battle-flash,
  .damage-number,
  .battle-shockwave,
  .battle-particle,
  .battle-result-fx,
  .battle-result-fx span {
    animation-duration: 1ms !important;
  }
}
</style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-4 select-none">

    <!-- Header Bar -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur p-3 rounded-xl border border-slate-800 shadow-lg mb-2">
        <div class="flex items-center space-x-2">
            <i class="fa-solid font-bold text-xl text-amber-400">✊✌️✋</i>
            <h1 class="text-lg md:text-xl font-black bg-gradient-to-r from-red-500 via-purple-500 to-blue-500 bg-clip-text text-transparent">
                化門板対戦
            </h1>
        </div>
        <button id="reset-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs md:text-sm font-semibold rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-rotate-right mr-1"></i>最初から
        </button>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center items-center">
        <!-- Screens will be rendered here dynamically via JS -->
    </main>
    <script src="game.js"></script>
</body>
</html>
