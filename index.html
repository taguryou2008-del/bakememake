<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化門板対戦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* iPad & Touch optimizations */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        /* Card & Effects Animation */
        .card-glow-human {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border: 2px solid #3b82f6;
        }
        .card-glow-bakemon {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            border: 2px solid #ef4444;
        }
        .damage-pop {
            animation: popUp 0.8s ease-out forwards;
        }
        @keyframes popUp {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-4 select-none">

    <!-- Header Bar -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur p-3 rounded-xl border border-slate-800 shadow-lg mb-2">
        <div class="flex items-center space-x-2">
            <i class="fa-solid font-bold text-xl text-amber-400">✊✌️✋</i>
            <h1 class="text-lg md:text-xl font-black bg-gradient-to-r from-red-500 via-purple-500 to-blue-500 bg-clip-text text-transparent">
                化門板対戦
            </h1>
        </div>
        <button id="reset-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs md:text-sm font-semibold rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-rotate-right mr-1"></i>最初から
        </button>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center items-center">
        <!-- Screens will be rendered here dynamically via JS -->
    </main>
    <script src="game.js"></script>
</body>
</html>
